[package]
name = "peacrust"
version = "0.1.0"
edition = "2024"
description = "A responsive, customizable clock, timer and stopwatch for the terminal, with a cava visualizer"
license = "MIT"
authors = ["Hiwarkar"]
rust-version = "1.88"

[dependencies]
crossterm = { version = "0.29", default-features = false, features = ["events"] }
jiff = "0.2"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
